<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>John Jang | Portfolio</title>
  <style>
    :root {
      --bg-1: #f5f7fa;
      --bg-2: #e9eef5;
      --text: #18212f;
      --muted: #4b5a70;
      --card: #ffffffcc;
      --line: #d4dde8;
      --accent: #0f766e;
      --accent-2: #155e75;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, #ffffff 0%, transparent 40%),
        radial-gradient(circle at 85% 5%, #d8e8ff 0%, transparent 35%),
        linear-gradient(155deg, var(--bg-1), var(--bg-2));
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }

    .wrap {
      width: min(760px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
      padding: 2rem;
      backdrop-filter: blur(3px);
      animation: rise 450ms ease-out;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .photo {
      width: 144px;
      height: 144px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
      display: block;
      margin: 0 auto 1rem;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(1.8rem, 3.3vw, 2.4rem);
      letter-spacing: 0.02em;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      justify-content: center;
      margin: 1.4rem 0 1.2rem;
    }

    .btn {
      text-decoration: none;
      color: #fff;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      padding: 0.75rem 1.1rem;
      border-radius: 12px;
      font-weight: 650;
      letter-spacing: 0.01em;
      transition: transform 140ms ease, box-shadow 140ms ease;
      box-shadow: 0 8px 18px rgba(21, 94, 117, 0.25);
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 12px 22px rgba(21, 94, 117, 0.32);
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 0.8rem;
      flex-wrap: wrap;
    }

    .links a {
      color: #0b4f6c;
      font-weight: 600;
      text-underline-offset: 0.2rem;
    }

    @media (max-width: 540px) {
      .wrap {
        padding: 1.4rem 1rem;
      }

      .photo {
        width: 120px;
        height: 120px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="photo" src="photo.webp" alt="Portrait of John Jang" />

    <h1>John Jang</h1>
    <section class="cta-row" aria-label="Portfolio documents">
      <a class="btn" href="case-study.pdf" target="_blank" rel="noopener noreferrer">View Case Study</a>
      <a class="btn" href="jang-john-resume.pdf" target="_blank" rel="noopener noreferrer">View Resume</a>
    </section>

    <nav class="links" aria-label="External profiles">
      <a href="http://www.linkedin.com/in/johnjang" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </nav>
  </main>
</body>
</html>
